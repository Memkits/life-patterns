name: Temporary formal typed index edit
on:
  pull_request:
    paths:
      - .github/workflows/formal-type-edit.yaml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit
      - name: Preserve rule values without erasing index types
        run: |
          set -euo pipefail
          mkdir -p .calcit/formal-edit
          git hash-object calcit.cirru > .calcit/formal-edit/before-blob.txt
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const run=(...args)=>JSON.parse(execFileSync('calcit',['calcit.cirru',...args,'--format','json'],{encoding:'utf8'}));
          const target='app.comp.container/comp-container';
          const operations=[];
          for(const path of ['@3.2.4.3.2','@3.2.4.6.2']){
            const old=run('tree','show',target,'--path',path).tree;
            if(old.length!==5||old[0]!=='->'||old[1]!=='code-array'||old[2][0]!=='map-indexed'||old[3][0]!=='filter'||old[4][0]!=='map')throw Error('Unexpected pipeline');
            const rebuilt=['->',['range',['count','code-array']]];
            for(const stage of old.slice(3)){
              const fn=stage[1],body=fn[2];
              if(fn[0]!=='fn'||JSON.stringify(fn[1])!=='["pair"]'||body[0]!=='let[]'||JSON.stringify(body[1])!=='["idx","v"]'||body[2]!=='pair'||body.length!==4)throw Error('Unexpected tuple consumer');
              rebuilt.push([stage[0],['fn',['idx'],['let',[['v',['.unwrap',['nth','code-array','idx']]]],body[3]]]]);
            }
            operations.push(['tree','replace',target,'--path',path,'--input-format','json-ast','--code',JSON.stringify(rebuilt)]);
          }
          const code=JSON.stringify(operations),dry=run('edit','transaction','--code',code,'--dry-run');
          if(!dry.scoped_revision)throw Error('Missing scope');
          const applied=run('edit','transaction','--code',code,'--expect-revision',dry.scoped_revision);
          writeFileSync('.calcit/formal-edit/report.json',JSON.stringify({operations,dry,applied},null,2));
          NODE
          cp calcit.cirru .calcit/formal-edit/calcit.cirru
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: formal-type-edit
          path: .calcit/formal-edit/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
