name: Temporary formal return and map edit
on:
  pull_request:
    paths:
      - .github/workflows/formal-type-edit.yaml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit
      - name: Apply two verified local corrections
        run: |
          set -euo pipefail
          mkdir -p .calcit/formal-edit
          git hash-object calcit.cirru > .calcit/formal-edit/before-blob.txt
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const run=(...args)=>JSON.parse(execFileSync('calcit',['calcit.cirru',...args,'--format','json'],{encoding:'utf8'}));
          const operations=[];
          function has(n,s){return n===s||Array.isArray(n)&&n.some(x=>has(x,s));}
          for(const target of ['app.comp.container/comp-container','app.comp.container/comp-filter']){
            let matches=0;
            function walk(n,path=[]){
              if(!Array.isArray(n))return;
              if(target.endsWith('/comp-container')&&n[0]==='fn'&&JSON.stringify(n[1])===JSON.stringify(['e','d!'])&&has(n,'highlight-node!')){
                if(n.at(-1)==='&unit')throw Error('Already Unit');
                operations.push(['tree','insert',target,'--path','@'+path.join('.'),'--at','append-child','--input-format','cirru','--code','quote &unit']);
                matches++;
              }
              if(target.endsWith('/comp-filter')&&n[0]==='if'&&n[3]==='{}'&&JSON.stringify(n[2])===JSON.stringify(['{}',[':opacity','1']])){
                operations.push(['tree','replace',target,'--path','@'+[...path,3].join('.'),'--input-format','json-ast','--code','["{}"]']);
                matches++;
              }
              n.forEach((child,i)=>walk(child,[...path,i]));
            }
            walk(run('query','def',target).data.code);
            if(matches!==1)throw Error('Unexpected correction count');
          }
          const code=JSON.stringify(operations);
          const dry=run('edit','transaction','--code',code,'--dry-run');
          if(!dry.scoped_revision)throw Error('Missing scope');
          const applied=run('edit','transaction','--code',code,'--expect-revision',dry.scoped_revision);
          writeFileSync('.calcit/formal-edit/report.json',JSON.stringify({operations,dry,applied},null,2));
          NODE
          cp calcit.cirru .calcit/formal-edit/calcit.cirru
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: formal-type-edit
          path: .calcit/formal-edit/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
