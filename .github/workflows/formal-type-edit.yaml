name: Temporary formal Enum boundary edit
on:
  pull_request:
    paths:
      - .github/workflows/formal-type-edit.yaml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit
      - name: Narrow open dispatch input with the Enum predicate
        run: |
          set -euo pipefail
          mkdir -p .calcit/formal-edit
          git hash-object calcit.cirru > .calcit/formal-edit/before-blob.txt
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const run=(...args)=>JSON.parse(execFileSync('calcit',['calcit.cirru',...args,'--format','json'],{encoding:'utf8'}));
          const target='app.main/render-app!',path='@3.3.3';
          const old=run('tree','show',target,'--path',path).tree;
          if(JSON.stringify(old)!==JSON.stringify(['dispatch!',['decode-map-as','raw-op',"'Enum"]]))throw Error('Unexpected dispatch boundary');
          const checked=['if',['enum?','raw-op'],['dispatch!','raw-op'],['raise','|Expected an Enum operation']];
          const operations=[['tree','replace',target,'--path',path,'--input-format','json-ast','--code',JSON.stringify(checked)]];
          const code=JSON.stringify(operations),dry=run('edit','transaction','--code',code,'--dry-run');
          if(!dry.scoped_revision)throw Error('Missing scope');
          const applied=run('edit','transaction','--code',code,'--expect-revision',dry.scoped_revision);
          writeFileSync('.calcit/formal-edit/report.json',JSON.stringify({operations,dry,applied},null,2));
          NODE
          cp calcit.cirru .calcit/formal-edit/calcit.cirru
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: formal-type-edit
          path: .calcit/formal-edit/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
